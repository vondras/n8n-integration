[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
files = ["custom_components/n8n_integration"]
