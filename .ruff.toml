# Focus on correctness, security, async usage and consistent imports/formatting.
target-version = "py314"
[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["E501"] # Formatter handles code; long error messages remain readable.
[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # Assertions and deliberate dummy credentials.
